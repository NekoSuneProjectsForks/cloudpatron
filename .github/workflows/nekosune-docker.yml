name: NekoSune CloudPatron Docker image

on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.nekosune'
      - 'docker/**'
      - 'compose.yaml'
      - 'payment-bridge/**'
      - '.github/workflows/nekosune-docker.yml'
  push:
    branches:
      - master
      - feature/nekosune-payments-discord-api
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish image to GHCR after successful build'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: nekosune-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build development Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.nekosune
          platforms: linux/amd64
          push: false
          tags: cloudpatron:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test both services
        run: |
          set -eu
          docker run -d --name cloudpatron-test \
            -e CLOUDPATRON_HTTP_HOST=localhost \
            -e BRIDGE_API_TOKEN=abcdef0123456789abcdef0123456789abcdef0123456789 \
            -e DOWNLOAD_SIGNING_SECRET=0123456789abcdef0123456789abcdef0123456789 \
            -p 18080:8080 cloudpatron:ci
          trap 'docker logs cloudpatron-test || true; docker rm -f cloudpatron-test || true' EXIT
          for i in $(seq 1 20); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:18080/signin; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:18080/patron-session
          curl --fail http://127.0.0.1:18080/shop?creatorId=demo
          curl --fail http://127.0.0.1:18080/v1/public/shop?creatorId=demo
      - name: Login to GHCR
        if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/nekosune-payments-discord-api'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GHCR image
        if: github.event_name == 'workflow_dispatch' && inputs.publish || github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            IMAGE_TAG=latest
          else
            IMAGE_TAG=dev
          fi
          docker tag cloudpatron:ci "ghcr.io/nekosuneprojectsforks/cloudpatron:${IMAGE_TAG}"
          docker push "ghcr.io/nekosuneprojectsforks/cloudpatron:${IMAGE_TAG}"
